<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .pulse-ring {
        animation: pulse 3s ease-out infinite;
        transform-origin: 1050px 150px;
      }
      .wave-line {
        animation: wave 8s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { r: 20px; opacity: 0.8; }
        50% { r: 60px; opacity: 0.3; }
        100% { r: 100px; opacity: 0; }
      }
      @keyframes wave {
        0% { transform: translateY(0px) stroke-dashoffset: 0; }
        100% { transform: translateY(-10px) stroke-dashoffset: 50; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Dynamic Animated Background Elements (Background layer) -->
  <g opacity="0.25">
    <circle cx="1050" cy="150" r="40" fill="none" stroke="#ef4444" stroke-width="2" class="pulse-ring"/>
    <circle cx="1050" cy="150" r="70" fill="none" stroke="#f97316" stroke-width="1.5" class="pulse-ring" style="animation-delay: 1s;"/>
    <path d="M 50 250 Q 300 200 600 250 T 1150 200" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="8 8" class="wave-line"/>
    <path d="M 50 270 Q 300 230 600 270 T 1150 230" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" class="wave-line" style="animation-delay: -2s;"/>
  </g>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
    <line x1="1100" y1="0" x2="1100" y2="300"/>
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
  </g>

  <!-- Side Accent Pillar -->
  <rect x="0" y="0" width="12" height="300" rx="6" fill="url(#accentGrad)"/>

  <!-- Foreground Title and Subtitle (Guaranteed high visibility and foreground placement) -->
  <g transform="translate(60, 0)">
    <!-- Badge -->
    <g transform="translate(0, 48)">
      <rect width="280" height="32" rx="16" fill="#ef4444" opacity="0.2"/>
      <rect width="280" height="32" rx="16" fill="none" stroke="#ef4444" stroke-width="1.5"/>
      <text x="140" y="21" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="1.5">EMERGENCY OPERATIONS CENTER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Emergency Operations Center
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20">
      Curated Ecosystem of Virtual EOCs, Incident Command, Crisis &amp; Disaster Response Systems
    </text>

    <!-- Pills / Tags -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="65" y="19" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">🚨 SaaS Platforms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="145" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="72.5" y="19" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">🌐 Open Source</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(299, 0)">
        <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="70" y="19" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">📡 ICS / NIMS Suite</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(451, 0)">
        <rect width="150" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="75" y="19" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">🗺️ Crisis Mapping</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Icon Symbol -->
  <g transform="translate(1050, 150)">
    <circle cx="0" cy="0" r="36" fill="#ef4444" opacity="0.15"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ef4444" stroke-width="2"/>
    <!-- Signal Antenna / Shield Icon -->
    <path d="M -10 10 L 0 -15 L 10 10 L 0 5 Z" fill="#f97316"/>
    <circle cx="0" cy="-15" r="4" fill="#fef08a"/>
  </g>
</svg>
